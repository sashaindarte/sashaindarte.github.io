				function gtag(){dataLayer.push(arguments);}

			<title>{{ page.title }}</title>

			<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
			<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
			<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		</head>
		<body>
			<div class="navbar">
				<div class="wrapper">
					<a href="/" class="left"><h1>Sasha Indarte</h1>
						<p>Assistant Professor of Finance</p>
						<p>The Wharton School</p>

				<a href="/" class="right">Home</a>

			</div>

			<div class="container">
			
			{{ content }}
			
			</div><!-- /.container -->
			<div class="footer">
				&copy; Sasha Indarte 2026
			</div>
			
			<script>
				var acc = document.getElementsByClassName("accordion");
				var i;
				for (i = 0; i < acc.length; i++) {
					acc[i].addEventListener("click", function() {
						this.classList.toggle("active");
						var panel = this.nextElementSibling;
						if (panel.style.maxHeight){
							panel.style.maxHeight = null;
						} else {
							panel.style.maxHeight = panel.scrollHeight + "px";
						} 
					});
				}
			</script>
			<script>
				var parts = ["aindarte", "edu", "wharton.upenn", "&#46;", "&#64;"];
				var email = parts[0] + parts[4] + parts[2] + parts[3] + parts[1];
				document.getElementById("email").innerHTML=email;
			</script>
			<script>
				// Highlight the current page in the navbar
				(function () {
					var path = window.location.pathname.replace(/index\.html$/, "");
					if (path.length > 1) path = path.replace(/\/+$/, "");
					var links = document.querySelectorAll(".navbar a.right");
					for (var i = 0; i < links.length; i++) {
						var href = links[i].getAttribute("href").replace(/\/+$/, "");
						var isHome = (href === "" || href === "/");
						var active = isHome
							? (path === "" || path === "/")
							: (path === href);
						if (active) { links[i].classList.add("active-page"); }
					}
				})();
			</script>
		</body>
	</html>
